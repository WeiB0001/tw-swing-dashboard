name: 每週回測（產生排名用的歷史勝率）

# 回測要重跑好幾百個交易日，比較慢（10～25 分鐘），所以每週跑一次就好。
# 跑完會產生 data/backtest.json，下一次日更的排名就會改用歷史勝率而非技術分數。
on:
  schedule:
    - cron: "0 16 * * 6"     # 台北時間週日 00:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 還原 data/history 的 CSV 快取，避免每次都重抓 14 個月
      # key 每天換一次，restore-keys 讓它接續前一天的快取往下增量更新
      - name: 還原歷史資料快取
        uses: actions/cache@v4
        with:
          path: data/history
          key: tw-history-${{ github.run_id }}
          restore-keys: |
            tw-history-

      # 用真實資料重新調校參數。只有 out-of-sample 贏過基準才會寫入
      # data/tuned_params.json，贏不了就什麼都不寫，維持預設值。
      - name: 自動調校參數
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/autotune.py --days 250 || echo "調校未通過驗證，維持預設參數"

      - name: 執行回測
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/backtest.py --days 250

      # 回測完立刻用新的勝率重建頁面，不必等隔天的日更
      - name: 以新回測結果重建儀表板
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/build.py || echo "重建失敗，保留既有 index.html"

      - name: 提交結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html || true
          if git diff --staged --quiet; then
            echo "沒有變動"
          else
            git commit -m "更新回測結果 $(TZ=Asia/Taipei date '+%Y-%m-%d')"
            git push
          fi

      - name: 打包網站檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: backtest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
