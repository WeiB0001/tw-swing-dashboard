name: 每週回測（產生排名用的歷史勝率）

# 回測要重跑好幾百個交易日，比較慢（10～25 分鐘），所以每週跑一次就好。
# 跑完會產生 data/backtest.json，下一次日更的排名就會改用歷史勝率而非技術分數。
on:
  schedule:
    - cron: "0 16 * * 6"     # 台北時間週日 00:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-dashboard
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 同步最新主分支與研究紀錄
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 還原 data/history 的 CSV 快取，避免每次都重抓 36 個月
      # key 每天換一次，restore-keys 讓它接續前一天的快取往下增量更新
      - name: 還原歷史資料快取
        uses: actions/cache@v4
        with:
          path: data/history
          key: tw-history-${{ github.run_id }}
          restore-keys: |
            tw-history-

      - name: 驗證淨利目標與排序規則
        run: python -m unittest discover -s tests -v

      - name: 執行回測
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/backtest.py --days 650

      # 回測完立刻用新的勝率重建頁面，不必等隔天的日更
      # 用網站實際發布過的排名做驗證，資料來自 data/history 的每日存檔
      - name: 追蹤實際排名表現
        run: python scripts/livecheck.py || echo "存檔還不夠，略過"

      - name: 以新回測結果重建儀表板
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/build.py

      - name: 提交結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html || true
          if git diff --staged --quiet; then
            echo "沒有變動"
          else
            git commit -m "更新回測結果 $(TZ=Asia/Taipei date '+%Y-%m-%d')"
            # 多個排程可能同時推送，直接 push 會因為 non-fast-forward 失敗。
            # 衝突或未成功保存時停止，不發布未同步的研究紀錄。
            PUSHED=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin main || exit 1
              if git push; then echo "已推送"; PUSHED=1; break; fi
              echo "第 $i 次推送失敗，10 秒後重試"; sleep 10
            done
            test "$PUSHED" = 1
          fi

      - name: 打包網站檔案
        uses: actions/upload-pages-artifact@v3
        with:
          # 只打包網站需要的檔案。整個 repo 打包會把歷史快取 CSV 一起塞進去，
          # 檔案一多就容易超時或失敗。
          path: .
          retention-days: 1

  deploy:
    needs: backtest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 兩個流程都會部署 Pages。GitHub 同時間只允許一個部署，
    # 沒有共用的 concurrency group 就會有一個直接失敗並寄通知。
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    steps:
      - name: 發布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
