name: 每週回測（產生排名用的歷史勝率）

# 回測要重跑好幾百個交易日，比較慢（10～25 分鐘），所以每週跑一次就好。
# 跑完會產生 data/backtest.json，下一次日更的排名就會改用歷史勝率而非技術分數。
on:
  schedule:
    - cron: "0 16 * * 6"     # 台北時間週日 00:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 執行回測
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/backtest.py --days 250

      - name: 提交回測結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json
          if git diff --staged --quiet; then
            echo "回測結果沒有變動"
          else
            git commit -m "更新回測結果 $(TZ=Asia/Taipei date '+%Y-%m-%d')"
            git push
          fi
