name: 每日更新台股價差儀表板

on:
  schedule:
    # GitHub Actions 的 cron 一律使用 UTC，台北時間 = UTC + 8
    - cron: "20 8 * * 1-5"    # 台北 16:20（收盤後第一次，主要更新）
    - cron: "0 10 * * 1-5"    # 台北 18:00（保險再跑一次，抓補的資料）
  workflow_dispatch:           # 允許手動點按鈕立刻執行

# 讓 workflow 有權限寫回 repo 並發布 GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 同時只跑一個，避免兩個排程撞在一起互相覆蓋
concurrency:
  group: build-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 產生儀表板
        env:
          # 選用：只有你在 repo Settings → Secrets 設了 FINMIND_TOKEN 才會啟用備援
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/build.py

      - name: 提交更新結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          # 沒有變動（例如休市日）就不要建立空 commit
          if git diff --staged --quiet; then
            echo "沒有變動，略過 commit"
          else
            git commit -m "更新儀表板 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 打包網站檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
